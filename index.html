<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen TCP - Para Mi Princesa ✈️</title>
    <style>
        :root {
            --pizarra-oscuro: #4A5568;
            --rosa-principal: #FF758C;
            --rosa-fuerte: #D53F8C;
            --rosa-pastel: #FFE4E6;
            --fondo-suave: #FFF0F5;
            --blanco: #FFFFFF;
            --error: #FB7185;
            --exito: #34D399;
            --tarjeta-bg: rgba(255, 255, 255, 0.9);
        }

        /* --- MODO OSCURO AUTOMÁTICO (MIDNIGHT ROMANCE) --- */
        @media (prefers-color-scheme: dark) {
            :root {
                --fondo-suave: #1A202C; 
                --blanco: #2D3748; 
                --pizarra-oscuro: #F7FAFC; 
                --rosa-principal: #FF7EB3;
                --rosa-fuerte: #F687B3; 
                --rosa-pastel: #4A5568; 
                --tarjeta-bg: rgba(45, 55, 72, 0.95);
            }
            body {
                background-image: radial-gradient(circle at 10% 20%, rgba(255, 126, 179, 0.05) 0%, transparent 25%),
                                  radial-gradient(circle at 90% 80%, rgba(213, 63, 140, 0.08) 0%, transparent 25%) !important;
            }
            .option-btn {
                background-color: #1A202C !important;
                border-color: #4A5568 !important;
                color: #E2E8F0 !important;
            }
            .option-btn:hover:not(:disabled) {
                background-color: #4A5568 !important;
                border-color: var(--rosa-principal) !important;
                color: var(--rosa-principal) !important;
            }
            .progress-bar { background-color: #4A5568 !important; }
            .debrief-item { background-color: #1A202C !important; border-color: #4A5568 !important;}
            select, input[type="checkbox"] { background-color: #1A202C; color: white; border-color: #4A5568;}
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Quicksand, Roboto, sans-serif; }

        body {
            background-color: var(--fondo-suave);
            color: var(--pizarra-oscuro);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 15% 50%, rgba(255, 117, 140, 0.08) 0%, transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(213, 63, 140, 0.06) 0%, transparent 25%);
        }

        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes pop { 0% { transform: scale(0.9); opacity: 0; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes pulseRed { 0% { color: var(--error); } 50% { color: #9F1239; transform: scale(1.1); } 100% { color: var(--error); } }

        .container {
            background-color: var(--tarjeta-bg);
            border-radius: 35px;
            box-shadow: 0 15px 40px rgba(213, 63, 140, 0.1);
            padding: 40px 30px;
            width: 100%; max-width: 550px;
            text-align: center; position: relative;
            border: 3px solid rgba(255, 117, 140, 0.1);
        }

        h1 { color: var(--rosa-fuerte); font-size: 1.8rem; margin-bottom: 10px; animation: float 4s ease-in-out infinite; }
        
        .setup-group {
            text-align: left; margin-bottom: 25px;
            background: rgba(255, 117, 140, 0.05); padding: 15px; border-radius: 20px;
        }

        select {
            width: 100%; padding: 12px; border-radius: 15px;
            border: 2px solid var(--rosa-principal); font-size: 1rem;
            margin-top: 5px; outline: none; cursor: pointer;
        }

        .checkbox-container {
            display: flex; align-items: center; gap: 10px;
            margin-top: 15px; font-weight: bold; cursor: pointer;
        }

        .checkbox-container input { width: 20px; height: 20px; accent-color: var(--rosa-principal); cursor: pointer; }

        .btn {
            background: linear-gradient(135deg, #FF7EB3 0%, #FF758C 100%);
            color: white; border: none; border-radius: 30px;
            padding: 16px 20px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; width: 100%; margin-bottom: 10px;
            transition: all 0.3s; box-shadow: 0 6px 15px rgba(255, 117, 140, 0.3);
        }
        .btn:hover:not(:disabled) { transform: translateY(-3px) scale(1.02); box-shadow: 0 10px 25px rgba(255, 117, 140, 0.5); }
        .btn:disabled { background: #CBD5E0; cursor: not-allowed; box-shadow: none; transform: none; }

        .hidden { display: none !important; }

        /* HUD: HUD elements (Lives, Timer, Highscore) */
        .hud-top {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px dashed rgba(255, 117, 140, 0.2);
        }
        .lives { font-size: 1.5rem; letter-spacing: 5px; transition: all 0.3s; }
        .timer { font-size: 1.2rem; font-weight: bold; color: var(--rosa-fuerte); display: flex; align-items: center; gap: 5px; }
        .timer.danger { animation: pulseRed 1s infinite; }
        
        .high-score-badge {
            background: rgba(255, 117, 140, 0.1); color: var(--rosa-fuerte);
            padding: 8px 15px; border-radius: 20px; font-weight: bold;
            display: inline-block; margin-bottom: 20px; font-size: 0.9rem;
        }

        .question-container { text-align: left; animation: slideIn 0.3s ease-out; }
        .question-text { font-size: 1.3rem; font-weight: 600; margin-bottom: 20px; line-height: 1.4; color: var(--pizarra-oscuro); }
        
        .options-container { display: flex; flex-direction: column; gap: 12px; }
        .option-btn {
            background-color: #FAFAFA; border: 2px solid #E2E8F0; border-radius: 20px;
            padding: 15px; font-size: 1.05rem; color: var(--pizarra-oscuro);
            cursor: pointer; text-align: left; transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) { border-color: var(--rosa-principal); background-color: var(--rosa-pastel); transform: translateX(5px); }
        .option-btn.correct { border-color: var(--exito); background-color: rgba(52, 211, 153, 0.15); color: #065F46; font-weight: bold; }
        .option-btn.incorrect { border-color: var(--error); background-color: rgba(251, 113, 133, 0.15); color: #9F1239; opacity: 0.8; }

        .progress-bar { width: 100%; height: 8px; background-color: #FEE2E2; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #FF7EB3, #FF758C); width: 0%; transition: width 0.4s; }

        .love-message { margin-top: 15px; font-size: 1.1rem; color: var(--rosa-fuerte); font-weight: bold; min-height: 28px; opacity: 0; }
        .love-message.show { animation: pop 0.4s forwards; }

        /* Debriefing Styles */
        .debrief-container { text-align: left; margin-top: 20px; max-height: 300px; overflow-y: auto; padding-right: 10px; }
        .debrief-item {
            background: #FAFAFA; border: 1px solid #E2E8F0; border-radius: 15px;
            padding: 15px; margin-bottom: 15px; font-size: 0.95rem;
        }
        .debrief-q { font-weight: bold; color: var(--pizarra-oscuro); margin-bottom: 8px; }
        .debrief-wrong { color: var(--error); text-decoration: line-through; margin-bottom: 5px; }
        .debrief-right { color: var(--exito); font-weight: bold; }

        .score-circle {
            width: 140px; height: 140px; border-radius: 50%;
            border: 8px solid var(--rosa-principal); display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; font-weight: bold; color: var(--rosa-fuerte);
            margin: 0 auto 15px auto; animation: pop 0.6s;
        }
        
        /* Custom Scrollbar for Debriefing */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--rosa-principal); border-radius: 10px; }
    </style>
</head>
<body>

<div class="container" id="home-screen">
    <h1>¡Hola Mi Princesa Perfecta! 💖✈️</h1>
    <p style="color: #718096; font-style: italic; margin-bottom: 20px;">Lista para tu próximo vuelo. ¡Confío plenamente en ti!</p>
    
    <div id="highscore-display" class="high-score-badge hidden">🏆 Récord en esta materia: <span id="hs-value">0</span>%</div>

    <div class="setup-group">
        <label style="font-weight: bold; color: var(--rosa-fuerte);">📚 Selecciona la Materia:</label>
        <select id="subject-selector" onchange="updateHighScoreDisplay()">
            <option value="https://raw.githubusercontent.com/nfuentes-cloud/Prueba-para-Mi-Prometida/refs/heads/main/AIRBUS%20A320.json" data-id="airbus_a320">AIRBUS A320</option>
            <option value="https://raw.githubusercontent.com/nfuentes-cloud/Prueba-para-Mi-Prometida/main/CRM%20y%20Factores%20Humanos.json?v=1" data-id="crm">CRM y Factores Humanos</option>
            <option value="https://raw.githubusercontent.com/nfuentes-cloud/Prueba-para-Mi-Prometida/refs/heads/main/Primeros%20Auxilios.json" data-id="primeros_auxilios">Primeros Auxilios</option>
            <option value="aerodinamica">Aerodinámica (Próximamente)</option>
        </select>

        <label class="checkbox-container">
            <input type="checkbox" id="timer-toggle">
            ⏳ Modo Contrarreloj (1 min x pregunta)
        </label>

        <label class="checkbox-container">
            <input type="checkbox" id="lives-toggle" checked>
            💖 Sistema de Vidas (3 Oportunidades)
        </label>
    </div>
    
    <button class="btn" id="btn-20" onclick="initiateLoad(30)">Misión Rápida (30 Preguntas)</button>
    <button class="btn" id="btn-40" onclick="initiateLoad(50)">Simulador (50 Preguntas)</button>
    <button class="btn" id="btn-100" onclick="initiateLoad(200)">Desafío Total (Todo)</button>
    <p id="loading-msg" class="hidden" style="color: var(--rosa-fuerte); font-weight: bold; margin-top: 15px;">Descargando plan de vuelo... ☁️</p>
</div>

<div class="container hidden" id="quiz-screen">
    <div class="hud-top">
        <div class="lives" id="lives-display">💖💖💖</div>
        <div class="timer hidden" id="timer-display">⏱️ <span id="time-left">00:00</span></div>
    </div>
    
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    
    <div class="question-container" id="q-container">
        <span id="question-counter" style="font-size: 0.9rem; color: #F43F5E; font-weight: bold; letter-spacing: 1px;"></span>
        <div class="question-text" id="question-text"></div>
        <div class="options-container" id="options"></div>
    </div>
    
    <div class="love-message" id="love-message"></div>
    <div style="text-align: right; margin-top: 20px;">
        <button class="btn hidden" id="next-btn" style="width: auto; padding: 12px 30px;" onclick="nextQuestion()">Siguiente ✨</button>
    </div>
</div>

<div class="container hidden" id="result-screen">
    <h1 id="result-main-title">¡Misión Cumplida! 🎉</h1>
    <div class="score-circle" id="score-display">100%</div>
    <h2 id="result-title" style="color: var(--rosa-fuerte); margin-bottom: 5px;"></h2>
    <p id="result-message" style="color: #4A5568; line-height: 1.5;"></p>
    
    <div id="debrief-section" class="hidden">
        <h3 style="color: var(--pizarra-oscuro); text-align: left; margin-top: 25px; border-bottom: 2px solid var(--rosa-pastel); padding-bottom: 5px;">📋 Debriefing del Vuelo (A revisar)</h3>
        <div class="debrief-container" id="debrief-list"></div>
    </div>

    <button class="btn" style="margin-top: 25px;" onclick="location.reload()">Volver a la Base ☁️💕</button>
</div>

<script>
    // Variables de estado
    let currentBank = [];
    let sessionQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let lives = 3;
    let useLives = true; // Nueva variable para controlar el modo
    let mistakes = []; 
    
    // Variables Timer
    let timerInterval;
    let totalSeconds = 0;

    let correctPhrases = [
        "¡Qué inteligente eres Mi Amorcito! 💕", "¡Esa es mi futura TCP! ✈️",
        "¡Lo estás haciendo excelente! ✨", "Respira profundo, te lo sabes de memoria ☁️",
        "¡Eres brillante Prometida Mía! 🌟", "¡Estoy muy orgulloso de ti, enserio! 🥰",
        "¡Eres perfecta! Sigue así 💖", "¡Tú puedes con todo, Mi Vida! 🌈"
    ];
    let incorrectPhrases = [
        "¡Casi! Esa era engañosa, pero ya no se te olvidará. 💫",
        "¡Casi! Revisa bien la correcta, la repasamos en el debriefing. 💫",
        "No te rindas, del error se aprende. ¡Tú puedes! 🌟",
        "Respira hondo y sigue adelante Mi Vida ☁️",
        "Tranquila, lo importante es aprender. ¡A seguir! 💪",
        "Te tengo fe, la próxima la tienes 🥰",
        "Los errores son parte del aprendizaje. ¡Vamos! ✈️",
        "Concéntrate Corazón, tú sabes esto 💕"
    ];

    async function loadPhrases() {
        try {
            const r1 = await fetch('frases-correctas.json');
            if (r1.ok) correctPhrases = await r1.json();
        } catch(e) {}
        try {
            const r2 = await fetch('frases-incorrectas.json');
            if (r2.ok) incorrectPhrases = await r2.json();
        } catch(e) {}
    }

    function randPhrase(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function normalizeQuestions(data) {
        if (!data || data.length === 0 || data[0].q !== undefined) return data;
        return data.map(item => {
            const correctText = (item.respuesta_correcta || '').trim();
            const options = (item.opciones || []).map(o => o.trim());
            const correctIndex = options.findIndex(o => o === correctText);
            return {
                q: item.pregunta || item.question,
                options: options,
                answer: correctIndex >= 0 ? correctIndex : 0
            };
        });
    }

    // --- AL INICIAR ---
    window.onload = () => { updateHighScoreDisplay(); loadPhrases(); }

    function updateHighScoreDisplay() {
        const select = document.getElementById('subject-selector');
        const subjectId = select.options[select.selectedIndex].getAttribute('data-id');
        const record = localStorage.getItem(`TCP_Record_${subjectId}`);
        const display = document.getElementById('highscore-display');
        
        if (record) {
            document.getElementById('hs-value').innerText = record;
            display.classList.remove('hidden');
        } else {
            display.classList.add('hidden');
        }
    }

    // --- FETCH ASÍNCRONO DE PREGUNTAS DESDE GITHUB ---
    async function initiateLoad(numQuestions) {
        document.getElementById('loading-msg').classList.remove('hidden');
        const buttons = document.querySelectorAll('#home-screen .btn');
        buttons.forEach(b => b.disabled = true);

        let subjectUrl = document.getElementById('subject-selector').value;
        subjectUrl = subjectUrl.replace("/refs/heads/", "/");
        
        if (!subjectUrl.startsWith("http")) {
            alert("⚠️ Esta materia aún está en desarrollo. Selecciona CRM.");
            document.getElementById('loading-msg').classList.add('hidden');
            buttons.forEach(b => b.disabled = false);
            return;
        }

        try {
            const response = await fetch(subjectUrl);
            if (!response.ok) throw new Error(`Error de red HTTP: ${response.status}`);
            
            const data = await response.json();
            currentBank = normalizeQuestions(data);
            startQuiz(numQuestions); 

        } catch (error) {
            console.error("DIAGNÓSTICO DE ERROR:", error);
            let mensajeError = "Error de conexión al cargar la materia.";
            if (error.message.includes("JSON") || error.message.includes("Unexpected token")) {
                mensajeError = "¡Alerta de Sintaxis! El archivo en GitHub tiene un error de formato JSON.";
            } else if (error.message.includes("HTTP")) {
                mensajeError = "El enlace de GitHub no funciona o el archivo fue borrado/es privado. " + error.message;
            }
            alert(mensajeError + "\n\nDetalle técnico: " + error.message);
            document.getElementById('loading-msg').classList.add('hidden');
            buttons.forEach(b => b.disabled = false);
        }
    }

    // --- LÓGICA PRINCIPAL ---
    function startQuiz(numQuestions) {
        let shuffled = [...currentBank];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        
        const totalAvailable = Math.min(numQuestions, shuffled.length);
        sessionQuestions = shuffled.slice(0, totalAvailable);
        
        currentIndex = 0; score = 0; mistakes = [];
        
        // Configurar Vidas
        useLives = document.getElementById('lives-toggle').checked;
        if (useLives) {
            lives = 3;
            document.getElementById('lives-display').classList.remove('hidden');
            document.getElementById('lives-display').innerHTML = "💖💖💖";
        } else {
            document.getElementById('lives-display').classList.add('hidden');
        }

        // Configurar Timer
        const isTimerOn = document.getElementById('timer-toggle').checked;
        if (isTimerOn) {
            totalSeconds = sessionQuestions.length * 60; 
            document.getElementById('timer-display').classList.remove('hidden');
            updateTimerUI();
            timerInterval = setInterval(tickTimer, 1000);
        } else {
            document.getElementById('timer-display').classList.add('hidden');
        }

        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        
        loadQuestion();
    }

    function tickTimer() {
        if (totalSeconds <= 0) {
            clearInterval(timerInterval);
            endGame(false, "¡Se acabó el tiempo en cabina! ⏰");
            return;
        }
        totalSeconds--;
        updateTimerUI();
    }

    function updateTimerUI() {
        const mins = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
        const secs = String(totalSeconds % 60).padStart(2, '0');
        const timerUI = document.getElementById('time-left');
        timerUI.innerText = `${mins}:${secs}`;
        
        if (totalSeconds < 60) {
            document.getElementById('timer-display').classList.add('danger');
        } else {
            document.getElementById('timer-display').classList.remove('danger');
        }
    }

    function loadQuestion() {
        const q = sessionQuestions[currentIndex];
        document.getElementById('question-counter').innerText = `Pregunta ${currentIndex + 1} de ${sessionQuestions.length}`;
        document.getElementById('question-text').innerText = q.q;
        
        const qContainer = document.getElementById('q-container');
        qContainer.style.animation = 'none'; qContainer.offsetHeight; qContainer.style.animation = 'slideIn 0.3s ease-out';

        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        
        q.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectAnswer(index, btn, q);
            optionsDiv.appendChild(btn);
        });

        document.getElementById('progress').style.width = `${(currentIndex / sessionQuestions.length) * 100}%`;
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('love-message').classList.remove('show');
    }

    function selectAnswer(selectedIndex, btnElement, qData) {
        const options = document.getElementById('options').children;
        for (let btn of options) { btn.disabled = true; btn.style.cursor = 'default'; }

        const correctIndex = qData.answer;
        const loveMsg = document.getElementById('love-message');
        
        if (selectedIndex === correctIndex) {
            btnElement.classList.add('correct');
            score++;
            loveMsg.innerText = randPhrase(correctPhrases);
            loveMsg.style.color = 'var(--rosa-fuerte)';
        } else {
            btnElement.classList.add('incorrect');
            options[correctIndex].classList.add('correct');
            
            mistakes.push({ 
                q: qData.q, 
                wrong: qData.options[selectedIndex], 
                right: qData.options[correctIndex] 
            });

            if (useLives) {
                lives--;
                updateLivesUI();
                loveMsg.innerText = randPhrase(incorrectPhrases);
                loveMsg.style.color = 'var(--pizarra-oscuro)';

                if (lives <= 0) {
                    setTimeout(() => endGame(false, "Te quedaste sin vidas Mi Princesa 💔"), 1500);
                    return;
                }
            } else {
                loveMsg.innerText = randPhrase(incorrectPhrases);
                loveMsg.style.color = 'var(--pizarra-oscuro)';
            }
        }

        loveMsg.classList.add('show');
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function updateLivesUI() {
        let hearts = "";
        for(let i=0; i<3; i++) { hearts += (i < lives) ? "💖" : "🤍"; }
        document.getElementById('lives-display').innerHTML = hearts;
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < sessionQuestions.length) {
            loadQuestion();
        } else {
            endGame(true, "");
        }
    }

    // --- FIN DEL JUEGO Y DEBRIEFING ---
    function endGame(completed, abortMessage) {
        clearInterval(timerInterval);
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        
        const percentage = Math.round((score / sessionQuestions.length) * 100);
        document.getElementById('score-display').innerText = `${percentage}%`;
        
        const titleText = document.getElementById('result-title');
        const msgText = document.getElementById('result-message');
        const mainTitle = document.getElementById('result-main-title');

        if (!completed) {
            mainTitle.innerText = "¡Vuelo Abortado! 🚨";
            titleText.innerText = abortMessage;
            msgText.innerText = "No te preocupes Mi Vida, los simuladores están para equivocarse y aprender. ¡Inténtalo de nuevo, tú puedes!";
            document.getElementById('score-display').style.borderColor = "var(--error)";
            document.getElementById('score-display').style.color = "var(--error)";
        } else {
            const select = document.getElementById('subject-selector');
            const subjectId = select.options[select.selectedIndex].getAttribute('data-id');
            const currentRecord = localStorage.getItem(`TCP_Record_${subjectId}`) || 0;
            
            if (percentage > currentRecord) {
                localStorage.setItem(`TCP_Record_${subjectId}`, percentage);
            }

            if (percentage === 100) {
                titleText.innerText = "¡PERFECTO! 🥇";
                msgText.innerText = "Eres una experta. ¡Me llenas de orgullo Mi Amorcitooo! Ese examen será un paseo por las nubes para ti.";
            } else if (percentage >= 80) {
                titleText.innerText = "¡Excelente Trabajo Mi Vida! 🌟";
                msgText.innerText = "Tienes los conocimientos listos. Confía en lo que sabes, respira profundo y ve por todo.";
            } else {
                titleText.innerText = "¡Buen repaso Mi Princesa! ☁️";
                msgText.innerText = "Lo importante es aprender de los errores ahora. Échale un vistazo al debriefing aquí abajo.";
            }
        }

        if (mistakes.length > 0) {
            document.getElementById('debrief-section').classList.remove('hidden');
            const list = document.getElementById('debrief-list');
            list.innerHTML = '';
            mistakes.forEach(m => {
                list.innerHTML += `
                    <div class="debrief-item">
                        <div class="debrief-q">${m.q}</div>
                        <div class="debrief-wrong">❌ Elegiste: ${m.wrong}</div>
                        <div class="debrief-right">✅ Correcta: ${m.right}</div>
                    </div>
                `;
            });
        }
    }
</script>
